<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EXRIDE Official Forum</title>
  <style>
    :root{
      --bg: #0f1724;
      --card: #0b1220;
      --muted: #98a0aa;
      --accent: #3b82f6;
      --glass: rgba(255,255,255,0.03);
      --radius: 12px;
      --max-width: 980px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    html,body{height:100%;}
    body{
      margin:0;
      background: linear-gradient(180deg,#071028 0%, #09121a 100%);
      color:#e6eef8;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:40px 16px;
    }
    .container{
      width:100%;
      max-width:var(--max-width);
      background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
      border-radius:16px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.7);
      overflow:hidden;
      border: 1px solid rgba(255,255,255,0.03);
    }
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:18px 22px;
      border-bottom:1px solid rgba(255,255,255,0.03);
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));
    }
    .brand{
      display:flex;gap:12px;align-items:center;
    }
    .logo{
      width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#7c3aed);display:flex;align-items:center;justify-content:center;font-weight:700;color:white;font-size:18px;box-shadow:0 4px 18px rgba(59,130,246,0.14);
    }
    h1{font-size:16px;margin:0}
    .tagline{font-size:12px;color:var(--muted)}
    nav{display:flex;gap:10px;align-items:center}
    .btn{background:transparent;border:1px solid rgba(255,255,255,0.04);padding:8px 12px;border-radius:10px;font-size:13px;color:var(--muted);cursor:pointer}
    .btn.primary{background:var(--accent);color:white;border:0}

    main{display:flex;gap:24px;padding:22px}
    .feed{flex:1}
    .sidebar{width:300px}

    /* Post card */
    .post{
      background: linear-gradient(180deg,var(--glass), rgba(255,255,255,0.01));
      border-radius:var(--radius);
      padding:16px;
      margin-bottom:14px;
      border:1px solid rgba(255,255,255,0.03);
      cursor:pointer;
      transition:transform .15s ease, box-shadow .15s ease;
    }
    .post:hover{transform:translateY(-6px);box-shadow:0 14px 30px rgba(2,6,23,0.6)}
    .post .meta{display:flex;align-items:center;gap:12px;margin-bottom:8px}
    .post .meta .author{font-size:13px;color:var(--muted)}
    .post .title{font-size:15px;margin:0 0 6px 0}
    .post .title.small{font-size:13px;font-weight:600;color:#e7eefc}
    .post .subtitle{font-size:13px;margin:0;color:var(--muted)}
    .post .excerpt{margin-top:10px;color:#cfd9e6;font-size:13px}

    /* Small helper */
    .small-label{font-size:12px;color:var(--muted);background:rgba(255,255,255,0.02);padding:6px 8px;border-radius:8px}

    /* Sidebar */
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent);padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.03);}
    .search{width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.03);background:transparent;color:inherit}

    footer{padding:14px 22px;color:var(--muted);font-size:13px;border-top:1px solid rgba(255,255,255,0.02);}

    @media (max-width:900px){main{flex-direction:column}.sidebar{width:100%}}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="logo">EX</div>
        <div>
          <h1>EXRIDE Official Forum</h1>
          <div class="tagline">The official place to discuss EXRIDE updates and community news — English only.</div>
        </div>
      </div>
      <nav>
        <button class="btn" id="new-post-btn">My account</button>
        <button class="btn primary" id="sign-in">Recently Viewed</button>
      </nav>
    </header>

    <main>
      <section class="feed" id="feed">
        <!-- Posts will be injected here by JavaScript -->
      </section>

      <aside class="sidebar">
        <div class="card" style="margin-bottom:12px">
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
            <div class="small-label">Forum Rules</div>
            <div style="flex:1"></div>
            <div class="small-label">EN</div>
          </div>
          <ul style="margin:0;padding-left:18px;color:var(--muted);font-size:13px">
            <li>All posts in English.</li>
            <li>Be respectful.</li>
            <li>No spam or self-promotion.</li>
          </ul>
        </div>
        <div class="card">
          <input class="search" id="search" placeholder="Search posts..." aria-label="Search posts" />
        </div>
      </aside>
    </main>

    <footer>
      EXRIDE Forum — Built for the community • All content in English unless otherwise requested.
    </footer>
  </div>

  <script>
    // Initial post data. First post is exactly as requested by the user.
    const posts = [
      {
        id: 1,
        title: 'XDR the most new to exride', // exactly as the user asked
        subtitle: 'The news updates to exride, all for september.',
        excerpt: 'Click to read about the latest EXRIDE September updates.',
        link: 'XDR2025.html'
      },
    ];

    const feed = document.getElementById('feed');

    function renderPosts(list){
      feed.innerHTML = '';
      list.forEach(post => {
        const el = document.createElement('article');
        el.className = 'post';
        el.setAttribute('data-id', post.id);
        el.innerHTML = `
          <div class="meta">
            <div class="author">Posted by EXRIDE Team</div>
            <div style="flex:1"></div>
            <div class="small-label">${post.id} • ${new Date().getFullYear()}</div>
          </div>
          <h3 class="title small">${escapeHtml(post.title)}</h3>
          <p class="subtitle">${escapeHtml(post.subtitle)}</p>
          <p class="excerpt">${escapeHtml(post.excerpt)}</p>
        `;

        // When clicking the card, navigate to the post's link (if provided)
        el.addEventListener('click', (e) => {
          // If link is '#', prevent navigation and show alert
          if(post.link && post.link !== '#'){
            window.location.href = post.link;
            return;
          }
          alert('This post does not have a destination page yet.');
        });

        feed.appendChild(el);
      });
    }

    // Basic search
    const searchInput = document.getElementById('search');
    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      if(!q){ renderPosts(posts); return; }
      const filtered = posts.filter(p => (p.title + ' ' + p.subtitle + ' ' + p.excerpt).toLowerCase().includes(q));
      renderPosts(filtered);
    });

    // New post button demo
    document.getElementById('new-post-btn').addEventListener('click', () => {
      const sample = {
        id: posts.length + 1,
        title: 'New sample post',
        subtitle: 'Example subtitle',
        excerpt: 'This is a sample post created from the demo New Post button.',
        link: '#'
      };
      posts.unshift(sample);
      renderPosts(posts);
      // Scroll to top of feed
      window.scrollTo({top:0,behavior:'smooth'});
    });

    // Utility: escape HTML to avoid XSS in this demo
    function escapeHtml(unsafe){
      return unsafe
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'",'&#039;');
    }

    // Render initial list
    renderPosts(posts);
  </script>
</body>
</html>
